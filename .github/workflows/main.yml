name: Deploy pdf-service

# Vercel's git integration handles web deploys automatically on push to
# develop (staging) and main (production). This workflow only owns the
# pdf-service sidecar on Cloud Run — Vercel is intentionally not touched here.

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/pdf-service/**'
      - 'packages/shared/**'
      - '.github/workflows/main.yml'

concurrency:
  group: deploy-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resumerx/shared build
      - run: pnpm --filter @resumerx/pdf-service test
      - run: pnpm --filter @resumerx/pdf-service build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: deploy (${{ github.ref_name }})
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVICE=resumerx-pdf-prod
          else
            SERVICE=resumerx-pdf-staging
          fi
          gcloud run deploy "$SERVICE" \
            --source apps/pdf-service \
            --region us-central1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet
