# fly.toml — pdf-service sidecar
# This is the staging config by default. `main.yml` deploys with --app to
# switch between resumerx-pdf-staging and resumerx-pdf-prod. Secrets live on
# each app via `flyctl secrets set` — not in this file.

app = "resumerx-pdf-staging"
primary_region = "iad"

[build]
  dockerfile = "../../apps/pdf-service/Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
